<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="6" />

  <!-- Community Connection Emblem (Two Interlinked Figures / Nodes Forming an 'M' Bridge) -->
  <g filter="url(#softShadow)" transform="translate(0, -18)">
    <!-- Left Person Head -->
    <circle cx="176" cy="148" r="34" fill="#1e3a8a" />
    <!-- Right Person Head -->
    <circle cx="336" cy="148" r="34" fill="#10b981" />
    <!-- Center Connection Spark / Shield Dot -->
    <circle cx="256" cy="116" r="18" fill="#4f46e5" />

    <!-- Interlinked Community Bridge ('M' Arch) -->
    <path
      d="M116 286 C116 218, 156 196, 196 212 L256 254 L316 212 C356 196, 396 218, 396 286"
      fill="none"
      stroke="url(#brandGrad)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- "MateMe" Bold Brand Wordmark -->
  <text
    x="256"
    y="392"
    text-anchor="middle"
    font-family="'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="98"
    font-weight="800"
    letter-spacing="-2"
    fill="#1e3a8a"
  >Mate<tspan fill="#4f46e5">Me</tspan></text>

  <!-- Subtle Accent Bar Underneath -->
  <rect x="176" y="420" width="160" height="10" rx="5" fill="url(#brandGrad)" />
</svg>
